}


// they don't play on the balcony: they take the whole screen, the way they were born. leave brings the balcony back.
const OLD_LOOK = { 0: frame, 1: frameRender };

/* ---------- the views, and moving between them ---------- */
let view = 'main', tween = null;
const fitFov = () => {
  const a = innerWidth / innerHeight;
  return a >= 1 ? clamp(2 * Math.atan(Math.tan(36 * Math.PI / 180) / a) * 180 / Math.PI, 38, 62)
                : Math.min(78, 2 * Math.atan(Math.tan(27 * Math.PI / 180) / a) * 180 / Math.PI);
};
const portrait = () => innerWidth / innerHeight < 1 || innerWidth < 760;
function viewPose(name) {
  const fov = fitFov(), a = innerWidth / innerHeight, th = Math.tan(fov * Math.PI / 360);
  if (name === 'canvas') {
    // look straight at the canvas, so it lies flat on the screen; the bedroom door to the right
    const f = FACING.clone().negate(), right = V(-f.z, 0, f.x);
    let d, shiftR = 0, shiftU = 0;
    if (portrait()) { d = CANVAS_SIZE / (.92 * 2 * th * a); shiftU = -.36 * d * th; }      // a little room above it for the way back
    else { d = CANVAS_SIZE / (.66 * 2 * th); shiftR = .3 * d * th * a; }
    const pos = CANVAS_AT.clone().addScaledVector(f, -d).addScaledVector(right, shiftR).add(V(0, shiftU, 0));
    return { pos, look: pos.clone().add(f), fov };
  }
  if (name === 'miko') { const pos = portrait() ? V(.02, 1.75, 1.45) : V(.02, 1.4, 1.02); return { pos, look: MIKO_AT.clone(), fov: Math.min(fov, 60) }; }
  return { pos: V(0, 1.42, .85), look: V(0, 1.12, -11), fov };
}
const aim = new THREE.PerspectiveCamera();                       // cameras look down -Z, so aim with one
const quatFor = (pos, look) => { aim.position.copy(pos); aim.lookAt(look); return aim.quaternion.clone(); };
function setPose(p) { camera.position.copy(p.pos); camera.quaternion.copy(quatFor(p.pos, p.look)); camera.fov = p.fov; camera.updateProjectionMatrix(); }
function go(name) {
  if (tween || name === view) return;
  const to = viewPose(name);
  if (name === 'miko') mikoMesh.lookAt(to.pos);                  // she faces you
  document.body.classList.add('moving');
  hot(false);
  tween = { from: { pos: camera.position.clone(), q: camera.quaternion.clone(), fov: camera.fov }, to: { pos: to.pos, q: quatFor(to.pos, to.look), fov: to.fov }, t: 0, start: performance.now(), dur: 1.5, name };
  if (name !== 'canvas' && view === 'canvas') { sel = null; redraw(); }
}
function stepTween(dt) {
  if (!tween) return;
  tween.t = Math.min(1, (performance.now() - tween.start) / 1000 / tween.dur);   // real time, however slow the frames
  const e = tween.t < .5 ? 4 * tween.t ** 3 : 1 - (-2 * tween.t + 2) ** 3 / 2;
  camera.position.lerpVectors(tween.from.pos, tween.to.pos, e);
  camera.quaternion.slerpQuaternions(tween.from.q, tween.to.q, e);
  camera.fov = tween.from.fov + (tween.to.fov - tween.from.fov) * e; camera.updateProjectionMatrix();
  if (tween.t >= 1) {
    view = tween.name; tween = null;
    document.body.dataset.view = view;
    place();
    document.body.classList.remove('moving');
  }
}

// lay the page's own controls exactly over their places in the scene
const toScreen = (v) => { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; };
function rectOf(points) {
  const s = points.map(toScreen);
  const x0 = Math.min(...s.map((p) => p.x)), x1 = Math.max(...s.map((p) => p.x)), y0 = Math.min(...s.map((p) => p.y)), y1 = Math.max(...s.map((p) => p.y));
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}
const put = (el, r) => Object.assign(el.style, { left: r.x0 + 'px', top: r.y0 + 'px', width: r.w + 'px', height: r.h + 'px' });
function place() {
  camera.updateMatrixWorld();
  if (view === 'main') {
    // the songs sit in the left pane of glass (on a phone, across both)
    const z = BAL.front, y0 = .1, y1 = BAL.rail - .05;
    const xs = portrait() ? [BAL.left, BAL.right] : [BAL.left, -.05];
    const r = rectOf([V(xs[0], y1, z), V(xs[1], y1, z), V(xs[0], y0, z), V(xs[1], y0, z)]);
    // it stands on the bottom of the pane and rises as tall as the songs need
    const m = 14, bottomRoom = 70;
    const x0 = Math.max(m, r.x0 + 10), x1 = Math.min(innerWidth - m, r.x1 - 10);
    const bottom = Math.min(innerHeight - bottomRoom, r.y1 - 10);
    const want = Math.min(600, innerHeight * .78, bottom - m);
    put($('panel'), { x0, y0: bottom - want, w: Math.min(x1 - x0, 520), h: want });
    if (!portrait()) {                                                // the invitation stands just left of the canvas
      const c = toScreen(CANVAS_AT.clone().add(V(0, .55, 0)));
      Object.assign($('toCanvas').style, { left: Math.min(innerWidth - 230, Math.max(r.x1 + 20, c.x - 230)) + 'px', top: Math.max(16, c.y - 30) + 'px' });
    }
  } else if (view === 'canvas') {
    const f = FACING, right = V(-f.z, 0, f.x).negate(), up = V(0, 1, 0), h = CANVAS_SIZE / 2;
    const face = CANVAS_AT.clone().addScaledVector(FACING, .02);
    const r = rectOf([face.clone().addScaledVector(right, -h).addScaledVector(up, h), face.clone().addScaledVector(right, h).addScaledVector(up, h),
                      face.clone().addScaledVector(right, -h).addScaledVector(up, -h), face.clone().addScaledVector(right, h).addScaledVector(up, -h)]);
    const s = Math.min(r.w, r.h);
    put(sleeve, { x0: r.x0 + (r.w - s) / 2, y0: r.y0 + (r.h - s) / 2, w: s, h: s });
    const tools = $('tools');
    if (portrait()) { tools.style.left = ''; tools.style.top = ''; }
    else { tools.style.left = Math.min(innerWidth - 346, r.x1 + 28) + 'px'; tools.style.top = Math.max(16, r.y0) + 'px'; }
    fitCanvas();
  } else if (view === 'miko') {
    mikoMesh.updateMatrixWorld();
    const g = mikoMesh.geometry.parameters, hw = g.width / 2, hh = g.height / 2;
    const pts = [V(-hw, hh, 0), V(hw, hh, 0), V(-hw, -hh, 0), V(hw, -hh, 0)].map((p) => p.applyMatrix4(mikoMesh.matrixWorld));
    put($('mikoBox'), rectOf(pts));
  }
}

// pointing at the canvas from the balcony
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function hot(on, e) {
  document.body.classList.toggle('hot', on);
  if (on && e) Object.assign($('hoverTag').style, { left: e.clientX + 'px', top: e.clientY + 'px' });
}
function overCanvas(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObject(easel, true).length > 0;
}
const focused = () => document.body.classList.contains('focus');
$('gl').addEventListener('pointermove', (e) => {
  if (focused()) { const k = out.width / innerWidth; viz.look = { x: e.clientX * k, y: e.clientY * k, at: performance.now() }; return; }   // the old eyes follow you
  if (view === 'main' && !tween) hot(overCanvas(e), e);
});
$('gl').addEventListener('click', (e) => { if (view === 'main' && !tween && !focused() && overCanvas(e)) go('canvas'); });
$('toCanvas').onclick = () => { if (!focused()) go('canvas'); };
$('back').onclick = () => go('main');
$('toMiko').onclick = () => { if (!focused()) go('miko'); };
$('pawIcon').src = STICKER_ART.heart.toDataURL();
$('backUp').onclick = () => go('main');
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { if (focused()) setFocus(false); else go('main'); }
  if (e.key === ' ' && focused()) { e.preventDefault(); togglePlay(); }
});

/* ---------- petting miko ----------
   Her eyes follow you. She blinks now and then. Move over her and she leans into it; tap her and
   she hops, smiles with her whole face, and hearts and sparkles pop out of her. */
const mbox = $('mikoBox');
function lookAt(x, y) {
  const r = mbox.getBoundingClientRect();
  if (!r.width) return;
  mikoEyes.forEach(({ e, el, r: er }) => {
    const ex = r.left + e.x / mikoInfo.width * r.width, ey = r.top + e.y / mikoInfo.height * r.height;
    const dx = x - ex, dy = y - ey, dist = Math.hypot(dx, dy) || 1, reach = Math.min(1, dist / 160);
    const R = er / mikoInfo.width * r.width;                           // the eye's radius on screen
    el.style.setProperty('--px', (dx / dist * reach * R * .32).toFixed(1) + 'px'); el.style.setProperty('--py', (dy / dist * reach * R * .28).toFixed(1) + 'px');
    el.style.setProperty('--gx', (dx / dist * reach * R * .5).toFixed(1) + 'px'); el.style.setProperty('--gy', (dy / dist * reach * R * .42).toFixed(1) + 'px');
  });
  const cx = r.left + r.width * .6, tilt = clamp((x - cx) / r.width * 9, -6, 6), nod = clamp((y - (r.top + r.height * .3)) / r.height * 3, -3, 3);
  $('mikoArt').style.transform = `rotate(${tilt.toFixed(2)}deg) translateY(${nod.toFixed(1)}px)`;
}
addEventListener('pointermove', (e) => { if (view === 'miko' && !tween) lookAt(e.clientX, e.clientY); });
(function blink() {                                                   // she blinks every few seconds
  setTimeout(() => { if (view === 'miko' && !mbox.classList.contains('happy')) { mbox.classList.add('blink'); setTimeout(() => mbox.classList.remove('blink'), 130); } blink(); }, 2200 + Math.random() * 3800);
})();
function popAt(x, y, ids, n, spread) {
  for (let i = 0; i < n; i++) {
    const img = document.createElement('img'); img.src = STICKER_ART[ids[i % ids.length]].toDataURL(); img.className = 'pop';
    const size = 20 + Math.random() * 22;
    Object.assign(img.style, { width: size + 'px', left: (x + rand(-spread, spread)) + 'px', top: (y + rand(-spread * .5, spread * .5)) + 'px', animationDelay: (i * .05) + 's' });
    img.style.setProperty('--dx', rand(-50, 50) + 'px'); img.style.setProperty('--rot', rand(-30, 30) + 'deg');
    document.body.append(img); setTimeout(() => img.remove(), 2200);
  }
}
let petAt = 0, stroke = 0, last = null;
function pet() {                                                      // a tap: the big reaction
  const t = performance.now();
  if (t - petAt < 600) return;
  petAt = t;
  mbox.classList.remove('happy'); void mbox.offsetWidth; mbox.classList.add('happy');
  clearTimeout(pet.t); pet.t = setTimeout(() => mbox.classList.remove('happy'), 1600);
  const r = mbox.getBoundingClientRect();
  popAt(r.left + r.width * .12, r.top + r.height * .35, ['heart', 'heart', 'sparkle'], 6, 30);
  popAt(r.left + r.width * .9, r.top + r.height * .35, ['heart', 'star', 'sparkle'], 6, 30);
}
mbox.addEventListener('pointerdown', (e) => { pet(); last = [e.clientX, e.clientY]; });
mbox.addEventListener('pointermove', (e) => {                         // stroking her: hearts where your hand goes
  if (last) stroke += Math.hypot(e.clientX - last[0], e.clientY - last[1]);
  last = [e.clientX, e.clientY];
  mbox.classList.add('pet'); clearTimeout(mbox.t_); mbox.t_ = setTimeout(() => mbox.classList.remove('pet'), 700);
  if (stroke > 170) { stroke = 0; popAt(e.clientX, e.clientY - 10, ['heart'], 1, 6); if (Math.random() < .35) { mbox.classList.add('happy'); clearTimeout(pet.t); pet.t = setTimeout(() => mbox.classList.remove('happy'), 900); } }
});
mbox.addEventListener('pointerleave', () => { last = null; });
mbox.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') pet(); });

/* ---------- credits ---------- */
$('creditsBtn').onclick = async () => {
  const list = $('creditList'); list.innerHTML = '';
  const add = (html) => { const li = document.createElement('li'); li.innerHTML = html; list.append(li); };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  add('music, words and miko: ours.');
  try { (await (await fetch('video/credits.json')).json()).forEach((c) => add(`${esc(c.title)} — ${esc(c.author)}, ${esc(c.license)}${c.source_url ? ` · <a href="${esc(c.source_url)}" target="_blank" rel="noopener">source</a>` : ''}`)); } catch {}
  add('3d: three.js (MIT).');
  $('credits').hidden = false;
};
$('creditsClose').onclick = () => { $('credits').hidden = true; };

/* ---------- the album on the easel follows every change ---------- */
let albumDirty = true;
function albumChanged() { albumDirty = true; }
function paintEaselAlbum() {
  const g = albumCanvas.getContext('2d'), S = albumCanvas.width;
  const bg = g.createRadialGradient(S * .3, S * .2, 0, S * .3, S * .2, S * 1.2);
  bg.addColorStop(0, '#fdfcf9'); bg.addColorStop(.58, '#f3f1ea'); bg.addColorStop(1, '#ebe8df');
  g.globalCompositeOperation = 'source-over'; g.fillStyle = bg; g.fillRect(0, 0, S, S);
  g.globalCompositeOperation = 'multiply'; paintAlbum(g, S, true); g.globalCompositeOperation = 'source-over';
  albumTex.needsUpdate = true; albumDirty = false;
}

/* ---------- the loop ---------- */
let lastT = performance.now(), robotClock = 0;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  if (!tween) setPose(viewPose(view));
  fitTrip();
  place();
}
addEventListener('resize', resize);
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (t - lastT) / 1000); lastT = t;
  viz.t += dt;
  levels(viz.t);
  stepTween(dt);
  stepTrip(dt);
  robotClock += dt;
  if (robotClock > .125 && trip.level < .99) { robotClock = 0; stepRobots(); }
  robotMat.uniforms.uOpacity.value = 1 - trip.level;
  mikoMesh.visible = mikoShadow.visible = view === 'miko' || !!(tween && tween.name === 'miko');   // she's at your feet: only there when you look down
  LAMPS.forEach((l, i) => { l.light.intensity = l.base * (.92 + .08 * Math.sin(viz.t * (.7 + i * .23) + i)); });
  if (albumDirty) paintEaselAlbum();
  if (!(OLD_LOOK[playingIdx] && trip.level > .995)) renderer.render(scene, camera);   // the balcony rests while an old song has the whole screen
}



/* ---------------- go ---------------- */
new ResizeObserver(() => { if (view === 'canvas') fitCanvas(); }).observe(sleeve);
updateTools();
tick(); setInterval(tick, 1000);
ping(); setInterval(ping, 20000);
load();
loadMiko().then(() => { if (view === 'miko') place(); }).catch(() => {});
resize();
requestAnimationFrame((t) => { lastT = t; loop(t); document.body.classList.add('ready'); });
window.balcony = { go, play, tripOn, trip, camera, scene, get view() { return view; }, mine: () => mine, set paintings(v) { paintings = v; }, get paintings() { return paintings; }, place, viz };

</script>
